<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create a breakur account." />
    <title>Create account | breakur</title>
    <link rel="stylesheet" href="/public/assets/app.css" />
  </head>
  <body class="min-h-screen bg-[#f6f1e8] font-mono text-[#111111] selection:bg-[#ffe500] selection:text-black">
    <main class="mx-auto flex min-h-screen w-full max-w-6xl items-center justify-center p-5 sm:p-8">
      <section class="w-full max-w-md border-4 border-black bg-[#ff5c35] shadow-[9px_9px_0_#111] sm:shadow-[12px_12px_0_#111]">
        <div class="flex items-center justify-between border-b-4 border-black px-5 py-4">
          <a class="text-2xl font-black tracking-[-0.12em] hover:underline" href="/">BREAKUR</a>
          <span class="border-2 border-black bg-white px-2 py-1 text-xs font-bold uppercase">02 / signup</span>
        </div>

        <div class="p-5 sm:p-7">
          <p class="mb-2 text-xs font-bold uppercase tracking-[0.16em]">No ceremony needed</p>
          <h1 class="text-4xl font-black leading-[0.9] tracking-[-0.08em] sm:text-5xl">MAKE LINKS<br />BEHAVE.</h1>

          <p id="form-error" class="hidden border-3 border-black bg-white p-3 text-sm font-bold" role="alert"></p>
          <form class="mt-8 space-y-5" action="/signup" method="post">
            <div>
              <label class="mb-2 block text-sm font-bold" for="name">YOUR NAME</label>
              <input class="w-full border-3 border-black bg-white px-4 py-3 text-base font-bold outline-none placeholder:text-[#777] focus:bg-[#fff5b8]" id="name" name="name" type="text" autocomplete="name" placeholder="Ada Lovelace" required />
            </div>
            <div>
              <label class="mb-2 block text-sm font-bold" for="username">USERNAME</label>
              <input class="w-full border-3 border-black bg-white px-4 py-3 text-base font-bold outline-none placeholder:text-[#777] focus:bg-[#fff5b8]" id="username" name="username" type="text" autocomplete="username" placeholder="ada_lovelace" pattern="[a-z0-9_]{3,32}" required />
            </div>
            <div>
              <label class="mb-2 block text-sm font-bold" for="email">EMAIL ADDRESS</label>
              <input class="w-full border-3 border-black bg-white px-4 py-3 text-base font-bold outline-none placeholder:text-[#777] focus:bg-[#fff5b8]" id="email" name="email" type="email" autocomplete="email" placeholder="you@domain.com" required />
            </div>
            <div>
              <label class="mb-2 block text-sm font-bold" for="password">CHOOSE A PASSWORD</label>
              <input class="w-full border-3 border-black bg-white px-4 py-3 text-base font-bold outline-none placeholder:text-[#777] focus:bg-[#fff5b8]" id="password" name="password" type="password" autocomplete="new-password" placeholder="8+ characters" minlength="8" required />
            </div>
            <button class="w-full border-3 border-black bg-[#ffe500] px-4 py-3 text-base font-black uppercase shadow-[5px_5px_0_#111] transition hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-[3px_3px_0_#111] focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-black" type="submit">Create account →</button>
          </form>

          <div class="mt-8 hidden" id="oauth">
            <p class="mb-4 border-t-3 border-black pt-5 text-xs font-bold uppercase tracking-[0.16em]">Or continue with</p>
            <div class="grid gap-3" id="oauth-buttons"></div>
          </div>

          <p class="mt-8 border-t-3 border-black pt-5 text-sm font-bold">ALREADY IN? <a class="underline decoration-3 underline-offset-3 hover:no-underline" href="/login">SIGN IN →</a></p>
        </div>
      </section>
    </main>
  </body>
  <script>
    const error = new URLSearchParams(window.location.search).get("error");
    if (error) { const target = document.querySelector("#form-error"); target.textContent = error; target.classList.remove("hidden"); }

    // Brand marks come from Simple Icons; small, correct, and served over HTTPS.
    const OAUTH_ICONS = {
      google: "https://cdn.simpleicons.org/google",
      github: "https://cdn.simpleicons.org/github",
    };

    fetch("/auth/providers")
      .then((response) => (response.ok ? response.json() : []))
      .then((providers) => {
        if (!providers || !providers.length) return;
        const box = document.querySelector("#oauth-buttons");
        for (const provider of providers) {
          const link = document.createElement("a");
          link.href = "/auth/" + encodeURIComponent(provider.name);
          link.className = "flex w-full items-center justify-center gap-2 border-3 border-black bg-white px-4 py-3 text-base font-black uppercase shadow-[5px_5px_0_#111] transition hover:translate-x-0.5 hover:translate-y-0.5 hover:shadow-[3px_3px_0_#111]";

          const iconSrc = OAUTH_ICONS[provider.name];
          if (iconSrc) {
            const icon = document.createElement("img");
            icon.src = iconSrc;
            icon.alt = "";
            icon.setAttribute("aria-hidden", "true");
            icon.style.cssText = "width:1.25rem;height:1.25rem;flex-shrink:0";
            link.appendChild(icon);
          }

          link.appendChild(document.createTextNode("Continue with " + provider.label));
          box.appendChild(link);
        }
        document.querySelector("#oauth").classList.remove("hidden");
      })
      .catch(() => {});
  </script>
</html>
